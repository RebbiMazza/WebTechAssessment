<!DOCTYPE html>
<html lang="en">
<head>
<title>Socials Landing Page</title>

<!--JQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the top navigation bar */
.topnav {
  overflow: hidden;
  background-color: #333;
}

/* Style the topnav links */
.topnav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

/* Change color on hover */
.topnav a:hover {
  background-color: #ddd;
  color: black;
}

/* Style the content */
.content {
  background-color: #ddd;
  padding: 10px;
}

/* Style the footer */
.footer {
  background-color: #f1f1f1;
  padding: 10px;
}
</style>
</head>
<body>

<div class="topnav">
  <button id=Insbtn onclick=""> Instagram </button>
  <button id=Linbtn onclick="" > linkedin </button>
</div>

<div class="content">
  <h2>Welcome!</h2>
  <p>Let's play pretend here... Welcome to Rebecca's social Page! <img src="smile.png" width="70px" lenght="70px"> </p>
<hr>
  <p id="Insp" style="display:none"> <img src="instagram-logo_971166-164438.avif" width=30% height= 30%> My Instagram</p>
  <p id="Linp" style="display:none"> <img src="linkedin logo.jpeg" width=30% height=30%> My Linkedin </p>
</div>


<!--slide toggle  -->
<script> 
$(document).ready(function(){
  $("#Insbtn").click(function(){
    $("#Insp").slideToggle("slow");
  });
});

$(document).ready(function(){
  $("#Linbtn").click(function(){
    $("#Linp").slideToggle("slow");
  });
});
</script>

<div class="footer">
  <p>Thank you</p>
</div>

</body>
</html>
